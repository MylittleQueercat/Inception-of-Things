# ConfigMap stores the page content separately from the nginx image.
# The Deployment below mounts index.html into nginx's web directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
data:
  # The ConfigMap key becomes a file named index.html when mounted.
  index.html: |
    <html>
      <body>
        <h1>Hello from app1</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  # Kubernetes keeps this many identical app1 Pods running.
  replicas: 1
  selector:
    # The Deployment manages Pods with this label. It must match the label
    # in template.metadata.labels below.
    matchLabels:
      app: app1
  # Kubernetes uses this template to create each app1 Pod.
  template:
    metadata:
      labels:
        # The Deployment selector and the Service both use this label to find
        # the app1 Pod.
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            # nginx listens on port 80 inside the container.
            - containerPort: 80
          volumeMounts:
            # Mount the ConfigMap-provided page over nginx's default web directory.
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            # This name refers to the ConfigMap defined at the top of this file.
            name: app1-html
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  # Forward traffic to Pods carrying the app: app1 label.
  selector:
    app: app1
  ports:
    # The Service listens on port 80 and forwards to port 80 in each Pod.
    - port: 80
      targetPort: 80
